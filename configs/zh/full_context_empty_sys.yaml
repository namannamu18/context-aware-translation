# English<->Chinese version of configs/full_context_empty_sys.yaml (datasets from scripts/prepare_zh_data.py).
# Run from the repository root: tower-eval gen-eval --config configs/zh/full_context_empty_sys.yaml
gen_data_dir: "instructions/full_context_empty_sys"
eval_data_dir: "raw_data"
gen_output_dir: "generations/full_context_empty_sys"
eval_output_dir: "evaluations/full_context_empty_sys"
tasks: 
  - name: mt
    subtasks:
      bmeld_dev.en-zh:
        eval_args:
          metrics:
            chrf:
            bleu:
              tokenizer: zh
            comet:
              batch_size: 16
            comet_kiwi:
              batch_size: 16
      bmeld_dev.zh-en:
      bmeld_test.en-zh:
        eval_args:
          metrics:
            chrf:
            bleu:
              tokenizer: zh
            comet:
              batch_size: 16
            comet_kiwi:
              batch_size: 16
      bmeld_test.zh-en:
      synthetic_chat_test.en-zh:
        eval_args:
          metrics:
            chrf:
            bleu:
              tokenizer: zh
            comet:
              batch_size: 16
            comet_kiwi:
              batch_size: 16
      synthetic_chat_test.zh-en:
    metrics:
      chrf:
      bleu:
      comet:
        batch_size: 16
      comet_kiwi:
        batch_size: 16
models:
  - name: TowerInstruct-WMT24-Chat-7B
    type: vllm
    arguments:
      model_dir: Unbabel/TowerInstruct-WMT24-Chat-7B
      n_gpus: 1
      max_tokens: 1024
      run_async: True
      batch_size: -1
      strip: False
