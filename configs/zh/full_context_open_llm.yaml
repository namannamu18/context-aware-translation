# English<->Chinese version of configs/full_context_openai.yaml (FREE replacement for gpt-4o) (datasets from scripts/prepare_zh_data.py).
# Run from the repository root: tower-eval gen-eval --config configs/zh/full_context_open_llm.yaml
gen_data_dir: "instructions/full_context"
eval_data_dir: "raw_data"
gen_output_dir: "generations/full_context_open_llm"
eval_output_dir: "evaluations/full_context_open_llm"
tasks: 
  - name: mt
    subtasks:
      bmeld_dev.en-zh:
        eval_args:
          metrics:
            chrf:
            bleu:
              tokenizer: zh
            comet:
              batch_size: 16
      bmeld_dev.zh-en:
      bmeld_test.en-zh:
        eval_args:
          metrics:
            chrf:
            bleu:
              tokenizer: zh
            comet:
              batch_size: 16
      bmeld_test.zh-en:
      synthetic_chat_test.en-zh:
        eval_args:
          metrics:
            chrf:
            bleu:
              tokenizer: zh
            comet:
              batch_size: 16
      synthetic_chat_test.zh-en:
    metrics:
      comet:
      chrf:
models:
  - name: Qwen2.5-7B-Instruct
    type: vllm
    arguments:
      model_dir: Qwen/Qwen2.5-7B-Instruct
      n_gpus: 1
      max_tokens: 1024
      batch_size: -1
      strip: False
      stop_sequences: ["<|im_end|>"]
