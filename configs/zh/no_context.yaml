# English<->Chinese version of configs/no_context.yaml / no_context_test_t_instruct.yaml (datasets from scripts/prepare_zh_data.py).
# Run from the repository root: tower-eval gen-eval --config configs/zh/no_context.yaml
gen_data_dir: "instructions/no_context"
eval_data_dir: "raw_data"
gen_output_dir: "generations/no_context"
eval_output_dir: "evaluations/no_context"
tasks: 
  - name: mt
    subtasks:
      bmeld_dev.en-zh:
        eval_args:
          metrics:
            chrf:
            bleu:
              tokenizer: zh
            comet:
              batch_size: 16
            comet_kiwi:
              batch_size: 16
      bmeld_dev.zh-en:
      bmeld_test.en-zh:
        eval_args:
          metrics:
            chrf:
            bleu:
              tokenizer: zh
            comet:
              batch_size: 16
            comet_kiwi:
              batch_size: 16
      bmeld_test.zh-en:
      synthetic_chat_test.en-zh:
        eval_args:
          metrics:
            chrf:
            bleu:
              tokenizer: zh
            comet:
              batch_size: 16
            comet_kiwi:
              batch_size: 16
      synthetic_chat_test.zh-en:
    metrics:
      chrf:
      bleu:
      comet:
        batch_size: 16
      comet_kiwi:
        batch_size: 16
models:
  - name: TowerInstruct-7B-v0.2_stop_seq
    type: vllm
    arguments:
      model_dir: Unbabel/TowerInstruct-7B-v0.2
      n_gpus: 1
      max_tokens: 1024
      batch_size: -1
      strip: False
